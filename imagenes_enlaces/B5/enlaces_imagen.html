<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Enlaces con imagen</title>
    <meta name="description" content="Enlaces cuyo rótulo es una imagen o una imagen y un texto">
    <meta name="author" content="Sami ElKhalil Darwish">
</head>
<body>
    <h1>Enlaces con imagen</h1>

    <!--
        Enlace 1: destino = https://www.w3.org/ ; rótulo = solo la imagen ;
        objetivo = abrir la web externa en una pestaña nueva (target="_blank").
    -->
    <p><a href="https://www.w3.org/" target="_blank"><img src="imagenes/logo.jpg" alt="Logo: ir al W3C" width="100"></a></p>

    <!--
        Enlace 2: destino = https://es.wikipedia.org/ ; rótulo = imagen + texto a la vez ;
        objetivo = abrir la web externa en una pestaña nueva (target="_blank").
    -->
    <p><a href="https://es.wikipedia.org/" target="_blank"><img src="imagenes/logo.jpg" alt="Logo" width="50"> Ir a Wikipedia</a></p>
</body>
</html>
