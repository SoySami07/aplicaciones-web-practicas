<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Cartel de festival</title>
    <meta name="description" content="Cartel de un festival con bordes y span">
    <meta name="author" content="Sami ElKhalil Darwish">
</head>
<body>
    <h1 style="border: 5px solid green;">Festival de Verano</h1>
    <p style="border: 3px dotted blue;">Tres días de música en directo junto al mar.</p>
    <p style="background-color:lightpink; border: 5px double red;">Entradas a la venta desde el 1 de diciembre.</p>
    <p>Actuarán <span style="color:blue;">Luna Roja</span> y <span style="color:green; font-size:200%;">Los Faroles</span> en el escenario principal.</p>

    <!--
        Pregunta: ¿qué diferencia hay entre <span> y <p> para destacar parte de un texto?
        <p> crea un bloque (empieza en una línea nueva), así que no sirve para destacar
        solo unas palabras dentro de una frase. <span> es en línea: se queda en la misma línea
        y permite darle estilo solo a esa parte del texto.
    -->
</body>
</html>
